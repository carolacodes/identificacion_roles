experiment_name: pii_v1_documentos
experiment:
  run_name: pii_schema_v1_documentos
  model: gliner2_pii
  schema: schema_v1_persona_simple
  input_mode: documentos_completos
  input_file: data/input_documentos/documentos.csv
  text_column: texto_limpio
  threshold: 0.6
  field_thresholds: {}
model:
  model_id: fastino/gliner2-privacy-filter-PII-multi
  display_name: GLiNER2 Privacy Filter PII Multi
  architecture: gliner2
  enabled: true
  device: cpu
  default_threshold: 0.5
schema:
  type: entities
  entities:
    persona_embargada:
      description: 'Persona física o jurídica sobre la cual recae directamente la
        medida de embargo, retención o ejecución. Puede ser mencionada como demandado,
        demandada, embargado, embargada, ejecutado, ejecutada, deudor o deudora. No
        incluir jueces, abogados, funcionarios, firmantes, personas autorizadas, actores,
        acreedores ni destinatarios del oficio.

        '
      threshold: null
