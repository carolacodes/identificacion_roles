experiment_name: comparacion_pii_v3_documentos
experiment:
  run_name: comparacion_pii_v3_documentos
  model: gliner2_pii
  schema: schema_v3_persona_structured
  input_mode: documentos_completos
  input_file: data/input_documentos/documentos.csv
  text_column: texto_limpio
  threshold: 0.65
  field_thresholds:
    nombre: 0.65
    dni: 0.55
    cuil_cuit: 0.55
model:
  model_id: fastino/gliner2-privacy-filter-PII-multi
  display_name: GLiNER2 Privacy Filter PII Multi
  architecture: gliner2
  enabled: true
  device: cpu
  default_threshold: 0.5
schema:
  type: structured
  name: persona_embargada
  description: 'Persona física o jurídica sobre la cual recae directamente la medida
    judicial de embargo, retención o ejecución. Puede aparecer mencionada como demandado,
    demandada, embargado, embargada, ejecutado, ejecutada, deudor o deudora. Extraer
    únicamente los datos pertenecientes a esa persona. No incluir actores, acreedores,
    jueces, abogados, funcionarios, firmantes, personas autorizadas, destinatarios
    del oficio ni titulares de cuentas judiciales utilizadas para depositar fondos.

    '
  fields:
    nombre:
      dtype: str
      description: 'Nombre completo de la persona física o razón social de la persona
        jurídica sobre la cual recae directamente la medida.

        '
      required: true
      threshold: null
    dni:
      dtype: str
      description: 'DNI correspondiente exclusivamente a la persona sobre la cual
        recae la medida judicial. Conservar el valor tal como aparece en el documento.
        Puede contener puntos, espacios o separadores. No extraer DNI de jueces, abogados,
        autorizados, actores, acreedores u otras personas mencionadas.

        '
      required: false
      threshold: null
      validator:
        type: regex
        pattern: ^\s*(?:D\.?\s*N\.?\s*I\.?\s*[:Nº°#-]?\s*)?\d{1,2}(?:[.\s]?\d{3}){2}\s*$
    cuil_cuit:
      dtype: str
      description: 'CUIL o CUIT correspondiente exclusivamente a la persona sobre
        la cual recae la medida judicial. Conservar el valor original y permitir guiones
        o espacios. No extraer CUIT del Poder Judicial, bancos, empresas destinatarias
        u otras personas ajenas al sujeto embargado.

        '
      required: false
      threshold: null
      validator:
        type: regex
        pattern: ^\s*(?:CUIL|CUIT|CUIL/CUIT)?\s*[:Nº°#-]?\s*\d{2}[-\s]?\d{8}[-\s]?\d\s*$
