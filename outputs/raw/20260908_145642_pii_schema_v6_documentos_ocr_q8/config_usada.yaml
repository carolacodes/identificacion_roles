experiment_name: pii_v6_documentos_ocr_q8
experiment:
  run_name: pii_schema_v6_documentos_ocr_q8
  model: gliner2_pii
  schema: schema_v6_persona_embargada_estricta
  input_mode: documentos_completos
  input_file: data/input_documentos/embargos_ocr_limpios.csv
  text_column: texto_ocr_limpio_Q8
  threshold: 0.65
  field_thresholds:
    nombre: 0.65
    rol_mencionado: 0.55
    evidencia_rol: 0.55
    dni: 0.55
    cuil_cuit: 0.55
model:
  model_id: fastino/gliner2-privacy-filter-PII-multi
  display_name: GLiNER2 Privacy Filter PII Multi
  architecture: gliner2
  enabled: true
  device: cpu
  default_threshold: 0.5
schema:
  type: structured
  name: persona_embargada
  description: 'Extraer exclusivamente a la persona física o jurídica sobre cuyos
    bienes, fondos, cuentas, haberes o activos recae directamente la medida judicial
    de embargo, retención o ejecución.

    La persona extraída debe estar explícitamente vinculada en el texto con expresiones
    como demandado, demandada, embargado, embargada, ejecutado, ejecutada, deudor,
    deudora, o con una frase que indique que sus fondos, cuentas, bienes o haberes
    serán embargados o retenidos.

    No extraer una persona solamente por aparecer mencionada en el documento.

    Excluir siempre jueces, secretarios, abogados, letrados, funcionarios, firmantes,
    autorizados para diligenciar, actores, acreedores, representantes, notificadores,
    destinatarios del oficio y titulares de cuentas utilizadas únicamente para depositar
    fondos judiciales.

    Si no existe evidencia suficiente de que la medida recae sobre una persona concreta,
    no extraerla.

    '
  fields:
    nombre:
      dtype: str
      description: 'Nombre completo o razón social exclusivamente del sujeto sobre
        el cual recae la medida. No devolver nombres de jueces, abogados, funcionarios,
        firmantes, autorizados, actores, acreedores ni destinatarios.

        '
      required: true
      threshold: null
    rol_mencionado:
      dtype: str
      description: 'Rol jurídico con el cual el documento identifica explícitamente
        a la persona extraída.

        '
      required: false
      threshold: null
      choices:
      - demandado
      - demandada
      - embargado
      - embargada
      - ejecutado
      - ejecutada
      - deudor
      - deudora
      - otro
    evidencia_rol:
      dtype: str
      description: 'Fragmento breve del texto que demuestra que la medida de embargo,
        retención o ejecución recae sobre la persona indicada en nombre.

        '
      required: false
      threshold: null
    dni:
      dtype: str
      description: 'DNI perteneciente exclusivamente a la misma persona indicada en
        nombre. No extraer DNI de abogados, autorizados, jueces, funcionarios, acreedores
        ni otras personas mencionadas.

        '
      required: false
      threshold: null
      validator:
        type: regex
        pattern: ^\s*(?:D\.?\s*N\.?\s*I\.?\s*[:Nº°#-]?\s*)?\d{1,2}(?:[.\s]?\d{3}){2}\s*$
    cuil_cuit:
      dtype: str
      description: 'CUIL o CUIT perteneciente exclusivamente a la misma persona indicada
        en nombre. No extraer CUIT del Poder Judicial, bancos, empresas destinatarias,
        abogados, funcionarios ni otras personas ajenas al sujeto embargado.

        '
      required: false
      threshold: null
      validator:
        type: regex
        pattern: ^\s*(?:CUIL|CUIT|CUIL/CUIT)?\s*[:Nº°#-]?\s*\d{2}[-\s]?\d{8}[-\s]?\d\s*$
