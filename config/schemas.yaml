schemas:
  # ============================================================
  # V1 - BASELINE SIMPLE
  # Detecta solamente a la persona sobre la cual recae la medida.
  # ============================================================
  schema_v1_persona_simple:
    type: entities

    entities:
      persona_embargada:
        description: >
          Persona física o jurídica sobre la cual recae directamente
          la medida de embargo, retención o ejecución.
          Puede ser mencionada como demandado, demandada, embargado,
          embargada, ejecutado, ejecutada, deudor o deudora.
          No incluir jueces, abogados, funcionarios, firmantes,
          personas autorizadas, actores, acreedores ni destinatarios
          del oficio.
        threshold: null

  # ============================================================
  # V2 - ROLES JURÍDICOS SEPARADOS
  # Sirve para experimentar con distintas denominaciones del rol.
  # ============================================================
  schema_v2_roles:
    type: entities

    entities:
      demandado:
        description: >
          Persona física o jurídica contra la cual se dirige la demanda.
          No incluir al actor, acreedor, juez, abogado, funcionario,
          firmante ni destinatario del oficio.
        threshold: null

      embargado:
        description: >
          Persona física o jurídica cuyos fondos, cuentas, bienes,
          haberes o activos son objeto directo de una medida de embargo.
          No incluir al acreedor, actor, juez, abogado, funcionario
          ni titulares de cuentas judiciales de depósito.
        threshold: null

      ejecutado:
        description: >
          Persona física o jurídica contra la cual se lleva adelante
          una ejecución judicial y sobre cuyos bienes o fondos puede
          recaer la medida.
        threshold: null

      deudor:
        description: >
          Persona física o jurídica obligada al pago de la deuda
          reclamada en el proceso judicial.
          No confundir con el acreedor.
        threshold: null

  # ============================================================
  # V3 - PERSONA EMBARGADA ESTRUCTURADA
  # Principal candidato para identificación de rol + identidad.
  # ============================================================
  schema_v3_persona_structured:
    type: structured

    name: persona_embargada

    description: >
      Persona física o jurídica sobre la cual recae directamente
      la medida judicial de embargo, retención o ejecución.
      Puede aparecer mencionada como demandado, demandada, embargado,
      embargada, ejecutado, ejecutada, deudor o deudora.
      Extraer únicamente los datos pertenecientes a esa persona.
      No incluir actores, acreedores, jueces, abogados, funcionarios,
      firmantes, personas autorizadas, destinatarios del oficio
      ni titulares de cuentas judiciales utilizadas para depositar fondos.

    fields:
      nombre:
        dtype: str
        description: >
          Nombre completo de la persona física o razón social de la
          persona jurídica sobre la cual recae directamente la medida.
        required: true
        threshold: null

      dni:
        dtype: str
        description: >
          DNI correspondiente exclusivamente a la persona sobre la cual
          recae la medida judicial.
          Conservar el valor tal como aparece en el documento.
          Puede contener puntos, espacios o separadores.
          No extraer DNI de jueces, abogados, autorizados, actores,
          acreedores u otras personas mencionadas.
        required: false
        threshold: null
        validator:
          type: regex
          pattern: '^\s*(?:D\.?\s*N\.?\s*I\.?\s*[:Nº°#-]?\s*)?\d{1,2}(?:[.\s]?\d{3}){2}\s*$'

      cuil_cuit:
        dtype: str
        description: >
          CUIL o CUIT correspondiente exclusivamente a la persona
          sobre la cual recae la medida judicial.
          Conservar el valor original y permitir guiones o espacios.
          No extraer CUIT del Poder Judicial, bancos, empresas destinatarias
          u otras personas ajenas al sujeto embargado.
        required: false
        threshold: null
        validator:
          type: regex
          pattern: '^\s*(?:CUIL|CUIT|CUIL/CUIT)?\s*[:Nº°#-]?\s*\d{2}[-\s]?\d{8}[-\s]?\d\s*$'

  # ============================================================
  # V4 - DATOS ECONÓMICOS DEL EMBARGO
  # Separa capital, costas y total.
  # ============================================================
  schema_v4_datos_embargo:
    type: structured

    name: datos_embargo

    description: >
      Datos económicos correspondientes directamente a la medida
      de embargo o ejecución.
      Extraer únicamente montos que indiquen cuánto debe embargarse
      o retenerse.
      No extraer números de expediente, cuentas bancarias,
      fechas ni otros valores numéricos ajenos al embargo.

    fields:
      monto_capital:
        dtype: str
        description: >
          Importe principal del crédito reclamado o monto principal
          sobre el cual se decreta la medida de embargo.
          Puede aparecer con símbolos o expresiones monetarias como
          $, $ 100.000, ARS 100.000, ARS $ 100.000,
          ARG $ 100.000 o pesos 100.000.
          Conservar el valor tal como aparece en el documento.
        required: false
        threshold: null
        validator:
          type: regex
          pattern: '^\s*(?:(?:ARS|ARG)\s*)?(?:\$)?\s*\d[\d.\s]*(?:,\d{1,2})?\s*$'

      monto_costas:
        dtype: str
        description: >
          Importe adicional presupuestado para intereses, costos,
          costas u otros conceptos accesorios de la ejecución.
          Puede aparecer precedido por $, ARS, ARG $, pesos
          u otras variantes monetarias equivalentes.
          No confundir con el capital principal.
        required: false
        threshold: null
        validator:
          type: regex
          pattern: '^\s*(?:(?:ARS|ARG)\s*)?(?:\$)?\s*\d[\d.\s]*(?:,\d{1,2})?\s*$'

      monto_total:
        dtype: str
        description: >
          Importe total a embargar cuando el documento lo expresa
          explícitamente como una suma total.
          No calcular ni sumar automáticamente monto_capital
          y monto_costas.
          Puede aparecer como $, ARS, ARG $, pesos u otra
          representación monetaria equivalente.
        required: false
        threshold: null
        validator:
          type: regex
          pattern: '^\s*(?:(?:ARS|ARG)\s*)?(?:\$)?\s*\d[\d.\s]*(?:,\d{1,2})?\s*$'

      moneda:
        dtype: str
        description: >
          Moneda correspondiente a los importes de la medida.
          Para documentos argentinos normalmente será ARS o pesos argentinos.
        required: false
        threshold: null
        choices:
          - ARS
          - USD
          - otra

  # ============================================================
  # V5 - CUENTA DE DEPÓSITO
  # Extrae exclusivamente dónde deben depositarse los fondos.
  # ============================================================
  schema_v5_cuenta_deposito:
    type: structured

    name: cuenta_deposito

    description: >
      Cuenta bancaria o judicial en la cual deben depositarse
      las sumas retenidas o embargadas.
      Extraer exclusivamente la cuenta de destino del dinero.
      No extraer cuentas, billeteras virtuales, CBU, CVU o aliases
      pertenecientes al demandado o sobre los cuales se está
      ejecutando el embargo.

    fields:
      cbu:
        dtype: str
        description: >
          CBU correspondiente exclusivamente a la cuenta donde deben
          depositarse las sumas retenidas o embargadas.
          Un CBU argentino contiene 22 dígitos, aunque en el OCR
          puede aparecer separado por espacios o guiones.
        required: false
        threshold: null
        validator:
          type: regex
          pattern: '^\s*(?:CBU\s*[:Nº°#-]?\s*)?(?:\d[\s-]?){22}\s*$'

      cvu:
        dtype: str
        description: >
          CVU correspondiente exclusivamente a la cuenta donde deben
          depositarse las sumas retenidas.
          Un CVU contiene 22 dígitos y puede aparecer separado
          por espacios o guiones debido al formato u OCR.
        required: false
        threshold: null
        validator:
          type: regex
          pattern: '^\s*(?:CVU\s*[:Nº°#-]?\s*)?(?:\d[\s-]?){22}\s*$'

      alias:
        dtype: str
        description: >
          Alias bancario correspondiente exclusivamente a la cuenta
          donde deben depositarse los fondos embargados.
          No extraer aliases pertenecientes a cuentas del demandado.
        required: false
        threshold: null

      numero_cuenta:
        dtype: str
        description: >
          Número de cuenta judicial o bancaria utilizada para recibir
          las sumas embargadas.
          Conservar separadores, barras, guiones y otros caracteres
          que formen parte del número.
        required: false
        threshold: null

      banco:
        dtype: str
        description: >
          Banco o entidad financiera donde se encuentra abierta
          la cuenta de depósito indicada por el juzgado.
        required: false
        threshold: null

      titular:
        dtype: str
        description: >
          Titular explícitamente indicado de la cuenta donde deben
          depositarse las sumas embargadas.
          No asumir un titular si el documento no lo indica.
        required: false
        threshold: null

  # ============================================================
  # V6 - PERSONA EMBARGADA ESTRICTA
  # ============================================================
  schema_v6_persona_embargada_estricta:
    type: structured

    name: persona_embargada

    description: >
      Extraer exclusivamente a la persona física o jurídica sobre cuyos
      bienes, fondos, cuentas, haberes o activos recae directamente
      la medida judicial de embargo, retención o ejecución.

      La persona extraída debe estar explícitamente vinculada en el texto
      con expresiones como demandado, demandada, embargado, embargada,
      ejecutado, ejecutada, deudor, deudora, o con una frase que indique
      que sus fondos, cuentas, bienes o haberes serán embargados o retenidos.

      No extraer una persona solamente por aparecer mencionada en el documento.

      Excluir siempre jueces, secretarios, abogados, letrados, funcionarios,
      firmantes, autorizados para diligenciar, actores, acreedores,
      representantes, notificadores, destinatarios del oficio y titulares
      de cuentas utilizadas únicamente para depositar fondos judiciales.

      Si no existe evidencia suficiente de que la medida recae sobre una
      persona concreta, no extraerla.

    fields:
      nombre:
        dtype: str
        description: >
          Nombre completo o razón social exclusivamente del sujeto
          sobre el cual recae la medida.
          No devolver nombres de jueces, abogados, funcionarios,
          firmantes, autorizados, actores, acreedores ni destinatarios.
        required: true
        threshold: null

      rol_mencionado:
        dtype: str
        description: >
          Rol jurídico con el cual el documento identifica explícitamente
          a la persona extraída.
        required: false
        threshold: null
        choices:
          - demandado
          - demandada
          - embargado
          - embargada
          - ejecutado
          - ejecutada
          - deudor
          - deudora
          - otro

      evidencia_rol:
        dtype: str
        description: >
          Fragmento breve del texto que demuestra que la medida de embargo,
          retención o ejecución recae sobre la persona indicada en nombre.
        required: false
        threshold: null

      dni:
        dtype: str
        description: >
          DNI perteneciente exclusivamente a la misma persona indicada
          en nombre.
          No extraer DNI de abogados, autorizados, jueces, funcionarios,
          acreedores ni otras personas mencionadas.
        required: false
        threshold: null
        validator:
          type: regex
          pattern: '^\s*(?:D\.?\s*N\.?\s*I\.?\s*[:Nº°#-]?\s*)?\d{1,2}(?:[.\s]?\d{3}){2}\s*$'

      cuil_cuit:
        dtype: str
        description: >
          CUIL o CUIT perteneciente exclusivamente a la misma persona
          indicada en nombre.
          No extraer CUIT del Poder Judicial, bancos, empresas destinatarias,
          abogados, funcionarios ni otras personas ajenas al sujeto embargado.
        required: false
        threshold: null
        validator:
          type: regex
          pattern: '^\s*(?:CUIL|CUIT|CUIL/CUIT)?\s*[:Nº°#-]?\s*\d{2}[-\s]?\d{8}[-\s]?\d\s*$'

  # ============================================================
  # V7 - PERSONA EMBARGADA DESDE FRAGMENTOS
  #
  # Diseñado especificamente para trabajar sobre fragmentos
  # clasificados como Datos_Embargado.
  #
  # La extraccion se realiza por fragmento y posteriormente
  # los candidatos se consolidan por numero_archivo.
  # ============================================================
  schema_v7_persona_embargada_fragmentos:
    type: structured

    name: persona_embargada

    description: >
      Extraer exclusivamente los datos de la persona fisica o juridica
      sobre la cual recae directamente la medida judicial de embargo,
      retencion o ejecucion mencionada en este fragmento.

      El fragmento puede provenir de una ventana de contexto asociada
      a expresiones como demandado, demandada, embargado, embargada,
      ejecutado, ejecutada, deudor, deudora, titular de fondos,
      titular de cuentas o frases equivalentes que indiquen que los
      bienes, fondos, cuentas, haberes o activos de una persona son
      objeto de la medida.

      No extraer una persona solamente porque aparezca mencionada
      dentro del fragmento.

      Excluir siempre:
      jueces,
      secretarios,
      abogados,
      letrados,
      funcionarios,
      firmantes,
      personas autorizadas para diligenciar,
      actores,
      acreedores,
      representantes,
      notificadores,
      destinatarios del oficio,
      empleados judiciales,
      y titulares de cuentas utilizadas exclusivamente para depositar
      fondos judiciales.

      Es posible que un fragmento individual no contenga el nombre
      del embargado. En ese caso no inventar ni inferir un nombre.
      Otros fragmentos del mismo documento podran aportar esa informacion
      y posteriormente seran consolidados.

    fields:
      nombre_embargado:
        dtype: str
        description: >
          Nombre completo de la persona fisica o razon social de la
          persona juridica sobre la cual recae directamente la medida
          de embargo, retencion o ejecucion.

          Extraer el nombre solamente cuando el fragmento proporcione
          evidencia suficiente de que esa persona es el sujeto afectado
          por la medida.

          No devolver nombres de jueces, abogados, secretarios,
          funcionarios, firmantes, autorizados, actores, acreedores,
          destinatarios ni otras personas mencionadas incidentalmente.

          Si el nombre del sujeto embargado no aparece en este fragmento,
          dejar el campo sin extraer. No inventar un nombre.
        required: false
        threshold: null

      dni_embargado:
        dtype: str
        description: >
          DNI perteneciente exclusivamente a la misma persona indicada
          en nombre_embargado.

          Extraerlo solamente cuando pueda vincularse claramente con
          la persona afectada por la medida.

          Conservar el valor tal como aparece en el fragmento,
          incluyendo puntos, espacios u otros separadores.

          No extraer DNI de jueces, abogados, funcionarios, autorizados,
          actores, acreedores ni otras personas mencionadas.
        required: false
        threshold: null
        validator:
          type: regex
          pattern: '^\s*(?:(?:D\.?\s*N\.?\s*I\.?|DOCUMENTO(?:\s+NACIONAL\s+DE\s+IDENTIDAD)?)\s*(?:(?:NRO|N[º°o])\.?\s*)?[:#-]?\s*)?\d{1,2}(?:[.\s-]?\d{3}){2}\s*$'
          flags:
            - IGNORECASE

      cuit_cuil_embargado:
        dtype: str
        description: >
          CUIT o CUIL perteneciente exclusivamente a la misma persona
          indicada en nombre_embargado.

          Extraerlo solamente cuando pueda vincularse claramente con
          el sujeto afectado por la medida.

          Conservar el valor tal como aparece en el fragmento.

          No extraer CUIT o CUIL del Poder Judicial, bancos,
          empresas destinatarias, abogados, funcionarios, acreedores
          ni otras personas ajenas al sujeto embargado.
        required: false
        threshold: null
        validator:
          type: regex
          pattern: '^\s*(?:(?:C\.?\s*U\.?\s*I\.?\s*L\.?|C\.?\s*U\.?\s*I\.?\s*T\.?|CUIL\s*/\s*CUIT|CUIT\s*/\s*CUIL)\s*(?:(?:NRO|N[º°o])\.?\s*)?[:#-]?\s*)?\d{2}(?:[-.\s]?\d){8}[-.\s]?\d\s*$'
          flags:
            - IGNORECASE

      rol_embargado:
        dtype: str
        description: >
          Rol juridico o expresion utilizada en el fragmento para
          identificar al sujeto sobre el cual recae la medida.

          Seleccionar el rol que mejor represente la mencion explicita
          del fragmento. No asignar un rol perteneciente a otra persona.
        required: false
        threshold: null
        choices:
          - demandado
          - demandada
          - embargado
          - embargada
          - ejecutado
          - ejecutada
          - deudor
          - deudora
          - titular
          - otro

  # ============================================================
  # V7 - PERSONA EMBARGADA DESDE FRAGMENTOS - DSPY
  #
  # Igual al schema_v7_persona_embargada_fragmentos,
  # pero usando las descripciones optimizadas por DSPy.
  # ============================================================
  schema_v7_persona_embargada_fragmentos_dspy:
    type: structured

    name: persona_embargada

    description: >
      Extraer exclusivamente los datos de la persona fisica o juridica
      sobre la cual recae directamente la medida judicial de embargo,
      retencion o ejecucion mencionada en este fragmento.

      El fragmento puede provenir de una ventana de contexto asociada
      a expresiones como demandado, demandada, embargado, embargada,
      ejecutado, ejecutada, deudor, deudora, titular de fondos,
      titular de cuentas o frases equivalentes que indiquen que los
      bienes, fondos, cuentas, haberes o activos de una persona son
      objeto de la medida.

      No extraer una persona solamente porque aparezca mencionada
      dentro del fragmento.

      Excluir siempre:
      jueces,
      secretarios,
      abogados,
      letrados,
      funcionarios,
      firmantes,
      personas autorizadas para diligenciar,
      actores,
      acreedores,
      representantes,
      notificadores,
      destinatarios del oficio,
      empleados judiciales,
      y titulares de cuentas utilizadas exclusivamente para depositar
      fondos judiciales.

      Es posible que un fragmento individual no contenga el nombre
      del embargado. En ese caso no inventar ni inferir un nombre.
      Otros fragmentos del mismo documento podran aportar esa informacion
      y posteriormente seran consolidados.

    fields:
      nombre_embargado:
        dtype: str
        description: >
          Nombre y apellido de persona física o razón social embargada o demandada
        required: false
        threshold: null

      dni_embargado:
        dtype: str
        description: >
          Documento Nacional de Identidad de 7 u 8 dígitos del embargado
        required: false
        threshold: null
        validator:
          type: regex
          pattern: '^\s*(?:(?:D\.?\s*N\.?\s*I\.?|DOCUMENTO(?:\s+NACIONAL\s+DE\s+IDENTIDAD)?)\s*(?:(?:NRO|N[º°o])\.?\s*)?[:#-]?\s*)?\d{1,2}(?:[.\s-]?\d{3}){2}\s*$'
          flags:
            - IGNORECASE

      cuit_cuil_embargado:
        dtype: str
        description: >
          Clave Única de Identificación Tributaria o Laboral del embargado
          con formato XX-XXXXXXXX-X o 11 dígitos
        required: false
        threshold: null
        validator:
          type: regex
          pattern: '^\s*(?:(?:C\.?\s*U\.?\s*I\.?\s*L\.?|C\.?\s*U\.?\s*I\.?\s*T\.?|CUIL\s*/\s*CUIT|CUIT\s*/\s*CUIL)\s*(?:(?:NRO|N[º°o])\.?\s*)?[:#-]?\s*)?\d{2}(?:[-.\s]?\d){8}[-.\s]?\d\s*$'
          flags:
            - IGNORECASE

      rol_embargado:
        dtype: str
        description: >
          Rol juridico o expresion utilizada en el fragmento para
          identificar al sujeto sobre el cual recae la medida.

          Seleccionar el rol que mejor represente la mencion explicita
          del fragmento. No asignar un rol perteneciente a otra persona.
        required: false
        threshold: null
        choices:
          - demandado
          - demandada
          - embargado
          - embargada
          - ejecutado
          - ejecutada
          - deudor
          - deudora
          - titular
          - otro

  # ============================================================
  # V1 - PERSONAS OBJETO DE OFICIOS JUDICIALES DESDE TEXTO OCR
  #
  # Entrada: columna texto_ocr (documento completo).
  # Unidad de procesamiento: un documento por fila del CSV.
  # Sin fragmentacion previa ni consolidacion posterior.
  # ============================================================
  schema_v1_persona_objeto_oficio_texto_ocr:
    type: structured

    name: persona_objeto_oficio

    description: >
      Extraer exclusivamente los datos de las personas fisicas o juridicas
      sobre las que recae directamente el requerimiento principal del oficio
      judicial o administrativo contenido en este texto OCR completo.

      Los oficios pueden solicitar informacion sobre titularidad o existencia
      de cuentas, billeteras virtuales, movimientos, transferencias, saldos,
      fondos, bienes, domicilios, actividad comercial o registros de usuarios;
      tambien pueden ordenar transferencias u otras actuaciones relacionadas
      con fondos de personas determinadas.

      Identificar al sujeto sobre el que se pide informacion o respecto del
      cual se solicita una actuacion. No exigir que sea demandado o embargado:
      puede ser actor, actora, demandado, demandada, causante, titular,
      beneficiario, tercero u otra persona expresamente individualizada.
      Una persona puede ser objeto del oficio aunque la medida no sea un embargo.

      Buscar evidencia en el cuerpo de la solicitud y en el auto judicial
      transcripto, considerando el documento completo. La caratula puede servir
      como contexto, pero nunca basta por si sola para decidir que una persona
      es objeto del requerimiento. En caso de contradiccion, priorizar la
      descripcion concreta de lo que se solicita a la entidad destinataria.

      Cuando el oficio enumere varias personas sobre las cuales se solicita
      informacion, extraer cada persona como un sujeto independiente, si el
      mecanismo de extraccion admite multiples registros.

      Excluir nombres o identificadores de jueces, secretarios, abogados,
      letrados, firmantes, usuarios de notificaciones, funcionarios,
      autorizados para diligenciar, notificadores, remitentes y otras
      personas citadas solo por su intervencion procesal o administrativa.
      Excluir a la empresa u organismo destinatario del oficio y los CUIT
      del Poder Judicial, bancos y cuentas judiciales utilizadas solo para
      recibir o depositar fondos. No excluir automaticamente a actores ni
      acreedores: incluirlos unicamente cuando sean objeto directo del pedido.

      El OCR puede contener errores, palabras cortadas, encabezados repetidos
      y transcripciones duplicadas. No inventar, completar, corregir ni
      normalizar nombres o identificadores; conservar el texto extraido.
      Si no se puede identificar un sujeto a partir del requerimiento,
      dejar los campos sin extraer.

    fields:
      nombre_persona:
        dtype: str
        description: >
          Nombre completo de la persona fisica o razon social de la entidad
          sobre la que el oficio solicita informacion o alguna actuacion
          concreta. Extraer el nombre que figure expresamente en el texto OCR,
          vinculado al pedido principal (por ejemplo, "informe si X posee
          cuenta", "movimientos de X", "fondos a nombre de X" o una lista
          de personas a verificar).

          No confundir con nombres presentes solo en la caratula, firmas,
          datos de notificacion, representacion procesal o transcripciones
          ajenas al requerimiento. No completar nombres parciales ni modificar
          su grafia. Si no hay evidencia suficiente, no extraer el campo.
        required: false
        threshold: null

      dni_persona:
        dtype: str
        description: >
          DNI que pertenece a la misma persona identificada en nombre_persona
          y que aparece expresamente asociado a ella en el texto OCR.
          Conservar puntos, espacios y separadores tal como aparecen.
          No asignar DNI de un abogado, juez, autorizado, firmante u otra
          persona, aunque aparezca cerca del nombre buscado. Si la
          asociacion es dudosa, no extraer el DNI.
        required: false
        threshold: null
        validator:
          type: regex
          pattern: '^\s*(?:(?:D\.?\s*N\.?\s*I\.?|DOCUMENTO(?:\s+NACIONAL\s+DE\s+IDENTIDAD)?)\s*(?:(?:NRO|N[º°o])\.?\s*)?[:#-]?\s*)?\d{1,2}(?:[.\s-]?\d{3}){2}\s*$'
          flags:
            - IGNORECASE

      cuit_cuil_persona:
        dtype: str
        description: >
          CUIT o CUIL correspondiente a la misma persona fisica o juridica
          extraida en nombre_persona. Extraerlo solo cuando el oficio lo
          asocie claramente con el sujeto del requerimiento. Conservar
          la grafia y los separadores originales, incluso si el documento
          escribe los 11 digitos sin guiones.

          No atribuir a esta persona los CUIT o CUIL de abogados,
          destinatarios (por ejemplo Mercado Pago), organismos judiciales,
          terceros no consultados, ni cuentas receptoras judiciales.
          Si la vinculacion es incierta, dejarlo sin extraer.
        required: false
        threshold: null
        validator:
          type: regex
          pattern: '^\s*(?:(?:C\.?\s*U\.?\s*I\.?\s*L\.?|C\.?\s*U\.?\s*I\.?\s*T\.?|CUIL\s*/\s*CUIT|CUIT\s*/\s*CUIL)\s*(?:(?:NRO|N[º°o])\.?\s*)?[:#-]?\s*)?\d{2}(?:[-.\s]?\d){8}[-.\s]?\d\s*$'
          flags:
            - IGNORECASE

      rol_persona:
        dtype: str
        description: >
          Rol o condicion explicita que el oficio atribuye al sujeto
          consultado o afectado por el requerimiento. Seleccionar la
          categoria respaldada por el texto OCR. Ser demandado, actor o
          causante no determina por si solo si es objeto del oficio:
          primero verificar el requerimiento concreto. Utilizar otro
          cuando la persona sea objeto del pedido pero su rol no encaje
          claramente en las opciones disponibles. No atribuir roles de
          otras personas.
        required: false
        threshold: null
        choices:
          - demandado
          - demandada
          - actor
          - actora
          - titular
          - causante
          - beneficiario
          - beneficiaria
          - embargado
          - embargada
          - ejecutado
          - ejecutada
          - deudor
          - deudora
          - tercero
          - tercera
          - otro

  # ============================================================
  # V1 - PERSONAS OBJETO DE OFICIOS JUDICIALES DESDE TEXTO OCR
  #
  # Entrada: columna fragmento.
  # Unidad de procesamiento: un fragmento por documento del CSV.
  # ============================================================
  schema_v1_persona_objeto_oficio_fragmentos:
    type: structured
    name: persona_objeto_oficio
    description: >
      Extraer exclusivamente los datos de las personas fisicas o juridicas
      sobre las que recae directamente el requerimiento principal del oficio
      judicial o administrativo al que pertenece este fragmento de texto.

      Los oficios pueden solicitar informacion sobre titularidad o existencia
      de cuentas, billeteras virtuales, movimientos, transferencias, saldos,
      fondos, bienes, domicilios, actividad comercial o registros de usuarios;
      tambien pueden ordenar transferencias u otras actuaciones relacionadas
      con fondos de personas determinadas.

      Identificar al sujeto sobre el que se pide informacion o respecto del
      cual se solicita una actuacion. No exigir que sea demandado o embargado:
      puede ser actor, actora, demandado, demandada, causante, titular,
      beneficiario, tercero u otra persona expresamente individualizada.
      Una persona puede ser objeto del oficio aunque la medida no sea un embargo.

      El fragmento proviene de un oficio judicial o administrativo y ha sido
      seleccionado por contener informacion potencialmente relevante sobre
      las personas involucradas en el requerimiento.

      Buscar evidencia dentro del fragmento recibido, prestando especial
      atencion a las expresiones que indiquen sobre quien se solicita
      informacion o respecto de quien se ordena una actuacion.
      El fragmento puede contener partes del cuerpo de la solicitud,
      del auto judicial transcripto o de la caratula del expediente.
      La caratula puede servir como contexto, pero nunca basta por si sola
      para decidir que una persona es objeto del requerimiento.
      Priorizar siempre la descripcion concreta de lo que se solicita
      a la entidad destinataria.

      Cuando el fragmento enumere varias personas sobre las cuales se
      solicita informacion, extraer cada persona como un sujeto independiente,
      si el mecanismo de extraccion admite multiples registros.

      No asumir que el fragmento contiene toda la informacion del oficio.
      Es posible que un fragmento individual no incluya el nombre,
      los identificadores o el rol de la persona consultada.
      Extraer unicamente los datos que aparezcan expresamente en el
      fragmento y que puedan vincularse con el sujeto del requerimiento.
      No asociar nombres, DNI o CUIT/CUIL de personas diferentes.

      Excluir nombres o identificadores de jueces, secretarios, abogados,
      letrados, firmantes, usuarios de notificaciones, funcionarios,
      autorizados para diligenciar, notificadores, remitentes y otras
      personas citadas solo por su intervencion procesal o administrativa.
      Excluir a la empresa u organismo destinatario del oficio y los CUIT
      del Poder Judicial, bancos y cuentas judiciales utilizadas solo para
      recibir o depositar fondos. No excluir automaticamente a actores ni
      acreedores: incluirlos unicamente cuando sean objeto directo del pedido.

      El fragmento puede contener errores de OCR, palabras cortadas,
      encabezados repetidos, nombres incompletos o transcripciones duplicadas.
      No inventar, completar, corregir ni normalizar nombres o identificadores;
      conservar el texto extraido tal como aparece en el fragmento.

      Si no existe evidencia suficiente dentro del fragmento para identificar
      a una persona como objeto del requerimiento, no extraerla.
      Si se identifica una persona pero alguno de sus datos no aparece
      o no puede asociarse con certeza, dejar ese campo sin extraer.
    fields:
      nombre_persona:
        dtype: str
        description: >
          Nombre completo de la persona fisica o razon social de la entidad
          sobre la que el oficio solicita informacion o alguna actuacion
          concreta. Extraer el nombre que figure expresamente en el fragmento,
          vinculado al pedido principal (por ejemplo, "informe si X posee
          cuenta", "movimientos de X", "fondos a nombre de X" o una lista
          de personas a verificar).

          Para personas fisicas, extraer exclusivamente nombres completos
          que contengan al menos un nombre de pila y un apellido identificables.
          El nombre puede aparecer en orden nombre-apellido o apellido-nombre,
          y sus componentes pueden estar separados por espacios, comas
          u otros signos de puntuacion.

          No extraer solamente el primer nombre, un apellido aislado,
          iniciales, apodos, diminutivos o fragmentos incompletos
          del nombre de una persona.

          IMPORTANTE: cuando el nombre aparezca dividido por una coma,
          como "OSVALDO, PABLO DANIEL", considerar todos sus componentes
          como parte del mismo nombre, siempre que correspondan a una
          unica persona. No detener la extraccion en la coma ni devolver
          solamente "OSVALDO" si el fragmento contiene el nombre completo.

          El fragmento puede contener una parte del requerimiento judicial,
          una transcripcion del auto que ordena la medida o una enumeracion
          de personas sobre las cuales se solicita informacion.
          Identificar exclusivamente los nombres que puedan vincularse
          con el objeto del requerimiento a partir de la evidencia
          presente en el fragmento.

          Cuando el fragmento mencione varias personas sobre las cuales
          se solicita informacion o alguna actuacion, extraer cada nombre
          como una persona independiente, si el mecanismo de extraccion
          admite multiples registros.

          No confundir con nombres presentes solo en la caratula, firmas,
          datos de notificacion, representacion procesal o transcripciones
          ajenas al requerimiento. No asumir que una persona es objeto
          del oficio solamente porque aparezca mencionada en el fragmento.

          No completar nombres parciales, corregir errores de OCR ni
          modificar su grafia. Conservar el nombre exactamente como aparece
          en el fragmento.

          Si el fragmento no contiene el nombre de la persona consultada
          o no existe evidencia suficiente para vincularlo con el
          requerimiento, no extraer el campo. No inferir nombres a partir
          de otros datos o personas mencionadas.
        required: false
        threshold: null
      dni_persona:
        dtype: str
        description: >
          DNI que pertenece a la misma persona identificada en nombre_persona
          y que aparece expresamente asociado a ella en el fragmento recibido.
          Extraer exclusivamente el DNI que pueda vincularse con la persona
          sobre la cual el oficio solicita informacion o alguna actuacion
          concreta.

          El fragmento puede contener nombres y documentos de varias personas,
          especialmente cuando el requerimiento incluye una lista de sujetos
          sobre los cuales se solicita informacion. En estos casos, asociar
          cada DNI exclusivamente con la persona a la que pertenece,
          respetando la correspondencia indicada en el fragmento.

          No asumir que un DNI pertenece a una persona solamente porque
          aparezca cerca de su nombre. Verificar que exista una relacion
          clara entre el identificador y la persona consultada, considerando
          expresiones como "titular del DNI", "DNI N°", "documento de identidad"
          o enumeraciones de nombres acompañados de sus respectivos DNI.

          No asignar DNI de abogados, jueces, secretarios, funcionarios,
          autorizados para diligenciar, firmantes, actores, demandados
          u otras personas mencionadas que no sean objeto directo
          del requerimiento.

          Conservar puntos, espacios y separadores tal como aparecen
          en el fragmento. No corregir errores de OCR, completar digitos
          faltantes ni modificar el formato original del identificador.

          Si el fragmento no contiene un DNI asociado a la persona
          identificada en nombre_persona, o si la vinculacion entre
          ambos es dudosa, no extraer el campo.
        required: false
        threshold: null
        validator:
          type: regex
          pattern: '^\s*(?:(?:D\.?\s*N\.?\s*I\.?|DOCUMENTO(?:\s+NACIONAL\s+DE\s+IDENTIDAD)?)\s*(?:(?:NRO|N[º°o])\.?\s*)?[:#-]?\s*)?\d{1,2}(?:[.\s-]?\d{3}){2}\s*$'
          flags:
            - IGNORECASE
      cuit_cuil_persona:
        dtype: str
        description: >
          CUIT o CUIL correspondiente a la misma persona fisica o juridica
          identificada en nombre_persona y que aparece expresamente asociado
          a ella en el fragmento recibido. Extraer exclusivamente el CUIT
          o CUIL que pueda vincularse con la persona sobre la cual el oficio
          solicita informacion o alguna actuacion concreta.

          El fragmento puede contener nombres e identificadores de varias
          personas o entidades, especialmente cuando el requerimiento incluye
          una lista de sujetos, cuentas bancarias, billeteras virtuales,
          transferencias o movimientos de fondos. En estos casos, asociar
          cada CUIT o CUIL exclusivamente con la persona a la que pertenece,
          respetando la correspondencia indicada en el fragmento.

          No asumir que un CUIT o CUIL pertenece a una persona solamente
          porque aparezca cerca de su nombre. Verificar que exista una
          relacion clara entre el identificador y la persona consultada,
          considerando expresiones como "titular del CUIT", "CUIL N°",
          "CUIT/CUIL", "correspondiente al CUIL" o enumeraciones de nombres
          acompañados de sus respectivos identificadores.

          No atribuir a la persona identificada en nombre_persona los CUIT
          o CUIL de abogados, jueces, secretarios, funcionarios, firmantes,
          destinatarios del oficio (por ejemplo Mercado Pago), organismos
          judiciales, bancos, terceros no consultados ni titulares de
          cuentas utilizadas exclusivamente para recibir fondos judiciales.

          Cuando el fragmento mencione transferencias entre distintas
          personas o entidades, distinguir los identificadores del emisor,
          del receptor y de los titulares de las cuentas involucradas.
          No asignar el CUIT o CUIL de una persona a otra por el solo
          hecho de participar en la misma operacion o requerimiento.

          Conservar la grafia y los separadores originales, incluyendo
          guiones, puntos y espacios, incluso cuando el identificador
          aparezca escrito como una secuencia de 11 digitos sin guiones.
          No corregir errores de OCR, completar digitos faltantes
          ni modificar el formato original.

          Si el fragmento no contiene un CUIT o CUIL asociado a la persona
          identificada en nombre_persona, o si la vinculacion entre ambos
          es dudosa, no extraer el campo.
        required: false
        threshold: null
        validator:
          type: regex
          pattern: '^\s*(?:(?:C\.?\s*U\.?\s*I\.?\s*L\.?|C\.?\s*U\.?\s*I\.?\s*T\.?|CUIL\s*/\s*CUIT|CUIT\s*/\s*CUIL)\s*(?:(?:NRO|N[º°o])\.?\s*)?[:#-]?\s*)?\d{2}(?:[-.\s]?\d){8}[-.\s]?\d\s*$'
          flags:
            - IGNORECASE
      rol_persona:
        dtype: str
        description: >
          Rol o condicion juridica explicita que el fragmento atribuye
          a la misma persona identificada en nombre_persona y sobre
          la cual el oficio solicita informacion o alguna actuacion concreta.
          Seleccionar exclusivamente la categoria respaldada por la
          evidencia presente en el fragmento recibido.

          El fragmento puede contener referencias a distintos sujetos
          procesales, como actores, act ORAS, demandados, demandadas,
          embargados, embargadas, ejecutados, ejecutadas, deudores,
          causantes, titulares, beneficiarios o terceros.
          Identificar el rol que corresponde especificamente a la persona
          objeto del requerimiento, sin confundirlo con el de otras
          personas mencionadas.

          No asumir que una persona es objeto del oficio solamente
          porque aparezca identificada como demandado, actor, causante
          o cualquier otro rol juridico. Primero verificar que el
          fragmento contenga evidencia de que sobre esa persona se
          solicita informacion o se ordena alguna actuacion concreta.

          Cuando el fragmento mencione varias personas con roles
          diferentes, asociar cada rol exclusivamente con la persona
          correspondiente. No atribuir el rol de un actor a un demandado,
          ni el de un titular, beneficiario o tercero a otra persona
          involucrada en el mismo requerimiento.

          Considerar tanto las denominaciones juridicas explicitas
          como las expresiones que indiquen la condicion de la persona
          respecto del requerimiento, por ejemplo "parte actora",
          "parte demandada", "causante", "titular de la cuenta",
          "beneficiario" o "persona embargada".

          Utilizar la categoria "otro" cuando la persona sea objeto
          directo del requerimiento, pero su rol o condicion explicita
          no encaje claramente en las opciones disponibles.
          No asignar un rol por inferencia cuando el fragmento
          no proporcione evidencia suficiente.

          El fragmento puede contener informacion parcial del oficio,
          por lo que el rol juridico puede no aparecer expresamente,
          aunque se identifique correctamente a la persona consultada.
          No inventar ni deducir roles a partir de la caratula,
          del tipo de juicio o de la sola presencia de un nombre.

          Si el fragmento no contiene evidencia suficiente para
          determinar el rol de la persona identificada en nombre_persona,
          no extraer el campo.
        required: false
        threshold: null
        choices:
          - demandado
          - demandada
          - actor
          - actora
          - titular
          - causante
          - beneficiario
          - beneficiaria
          - embargado
          - embargada
          - ejecutado
          - ejecutada
          - deudor
          - deudora
          - tercero
          - tercera
          - otro
