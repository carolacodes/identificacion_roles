schemas:
  # ============================================================
  # V1 - BASELINE SIMPLE
  # Detecta solamente a la persona sobre la cual recae la medida.
  # ============================================================
  schema_v1_persona_simple:
    type: entities

    entities:
      persona_embargada:
        description: >
          Persona física o jurídica sobre la cual recae directamente
          la medida de embargo, retención o ejecución.
          Puede ser mencionada como demandado, demandada, embargado,
          embargada, ejecutado, ejecutada, deudor o deudora.
          No incluir jueces, abogados, funcionarios, firmantes,
          personas autorizadas, actores, acreedores ni destinatarios
          del oficio.
        threshold: null

  # ============================================================
  # V2 - ROLES JURÍDICOS SEPARADOS
  # Sirve para experimentar con distintas denominaciones del rol.
  # ============================================================
  schema_v2_roles:
    type: entities

    entities:
      demandado:
        description: >
          Persona física o jurídica contra la cual se dirige la demanda.
          No incluir al actor, acreedor, juez, abogado, funcionario,
          firmante ni destinatario del oficio.
        threshold: null

      embargado:
        description: >
          Persona física o jurídica cuyos fondos, cuentas, bienes,
          haberes o activos son objeto directo de una medida de embargo.
          No incluir al acreedor, actor, juez, abogado, funcionario
          ni titulares de cuentas judiciales de depósito.
        threshold: null

      ejecutado:
        description: >
          Persona física o jurídica contra la cual se lleva adelante
          una ejecución judicial y sobre cuyos bienes o fondos puede
          recaer la medida.
        threshold: null

      deudor:
        description: >
          Persona física o jurídica obligada al pago de la deuda
          reclamada en el proceso judicial.
          No confundir con el acreedor.
        threshold: null

  # ============================================================
  # V3 - PERSONA EMBARGADA ESTRUCTURADA
  # Principal candidato para identificación de rol + identidad.
  # ============================================================
  schema_v3_persona_structured:
    type: structured

    name: persona_embargada

    description: >
      Persona física o jurídica sobre la cual recae directamente
      la medida judicial de embargo, retención o ejecución.
      Puede aparecer mencionada como demandado, demandada, embargado,
      embargada, ejecutado, ejecutada, deudor o deudora.
      Extraer únicamente los datos pertenecientes a esa persona.
      No incluir actores, acreedores, jueces, abogados, funcionarios,
      firmantes, personas autorizadas, destinatarios del oficio
      ni titulares de cuentas judiciales utilizadas para depositar fondos.

    fields:
      nombre:
        dtype: str
        description: >
          Nombre completo de la persona física o razón social de la
          persona jurídica sobre la cual recae directamente la medida.
        required: true
        threshold: null

      dni:
        dtype: str
        description: >
          DNI correspondiente exclusivamente a la persona sobre la cual
          recae la medida judicial.
          Conservar el valor tal como aparece en el documento.
          Puede contener puntos, espacios o separadores.
          No extraer DNI de jueces, abogados, autorizados, actores,
          acreedores u otras personas mencionadas.
        required: false
        threshold: null
        validator:
          type: regex
          pattern: '^\s*(?:D\.?\s*N\.?\s*I\.?\s*[:Nº°#-]?\s*)?\d{1,2}(?:[.\s]?\d{3}){2}\s*$'

      cuil_cuit:
        dtype: str
        description: >
          CUIL o CUIT correspondiente exclusivamente a la persona
          sobre la cual recae la medida judicial.
          Conservar el valor original y permitir guiones o espacios.
          No extraer CUIT del Poder Judicial, bancos, empresas destinatarias
          u otras personas ajenas al sujeto embargado.
        required: false
        threshold: null
        validator:
          type: regex
          pattern: '^\s*(?:CUIL|CUIT|CUIL/CUIT)?\s*[:Nº°#-]?\s*\d{2}[-\s]?\d{8}[-\s]?\d\s*$'

  # ============================================================
  # V4 - DATOS ECONÓMICOS DEL EMBARGO
  # Separa capital, costas y total.
  # ============================================================
  schema_v4_datos_embargo:
    type: structured

    name: datos_embargo

    description: >
      Datos económicos correspondientes directamente a la medida
      de embargo o ejecución.
      Extraer únicamente montos que indiquen cuánto debe embargarse
      o retenerse.
      No extraer números de expediente, cuentas bancarias,
      fechas ni otros valores numéricos ajenos al embargo.

    fields:
      monto_capital:
        dtype: str
        description: >
          Importe principal del crédito reclamado o monto principal
          sobre el cual se decreta la medida de embargo.
          Puede aparecer con símbolos o expresiones monetarias como
          $, $ 100.000, ARS 100.000, ARS $ 100.000,
          ARG $ 100.000 o pesos 100.000.
          Conservar el valor tal como aparece en el documento.
        required: false
        threshold: null
        validator:
          type: regex
          pattern: '^\s*(?:(?:ARS|ARG)\s*)?(?:\$)?\s*\d[\d.\s]*(?:,\d{1,2})?\s*$'

      monto_costas:
        dtype: str
        description: >
          Importe adicional presupuestado para intereses, costos,
          costas u otros conceptos accesorios de la ejecución.
          Puede aparecer precedido por $, ARS, ARG $, pesos
          u otras variantes monetarias equivalentes.
          No confundir con el capital principal.
        required: false
        threshold: null
        validator:
          type: regex
          pattern: '^\s*(?:(?:ARS|ARG)\s*)?(?:\$)?\s*\d[\d.\s]*(?:,\d{1,2})?\s*$'

      monto_total:
        dtype: str
        description: >
          Importe total a embargar cuando el documento lo expresa
          explícitamente como una suma total.
          No calcular ni sumar automáticamente monto_capital
          y monto_costas.
          Puede aparecer como $, ARS, ARG $, pesos u otra
          representación monetaria equivalente.
        required: false
        threshold: null
        validator:
          type: regex
          pattern: '^\s*(?:(?:ARS|ARG)\s*)?(?:\$)?\s*\d[\d.\s]*(?:,\d{1,2})?\s*$'

      moneda:
        dtype: str
        description: >
          Moneda correspondiente a los importes de la medida.
          Para documentos argentinos normalmente será ARS o pesos argentinos.
        required: false
        threshold: null
        choices:
          - ARS
          - USD
          - otra

  # ============================================================
  # V5 - CUENTA DE DEPÓSITO
  # Extrae exclusivamente dónde deben depositarse los fondos.
  # ============================================================
  schema_v5_cuenta_deposito:
    type: structured

    name: cuenta_deposito

    description: >
      Cuenta bancaria o judicial en la cual deben depositarse
      las sumas retenidas o embargadas.
      Extraer exclusivamente la cuenta de destino del dinero.
      No extraer cuentas, billeteras virtuales, CBU, CVU o aliases
      pertenecientes al demandado o sobre los cuales se está
      ejecutando el embargo.

    fields:
      cbu:
        dtype: str
        description: >
          CBU correspondiente exclusivamente a la cuenta donde deben
          depositarse las sumas retenidas o embargadas.
          Un CBU argentino contiene 22 dígitos, aunque en el OCR
          puede aparecer separado por espacios o guiones.
        required: false
        threshold: null
        validator:
          type: regex
          pattern: '^\s*(?:CBU\s*[:Nº°#-]?\s*)?(?:\d[\s-]?){22}\s*$'

      cvu:
        dtype: str
        description: >
          CVU correspondiente exclusivamente a la cuenta donde deben
          depositarse las sumas retenidas.
          Un CVU contiene 22 dígitos y puede aparecer separado
          por espacios o guiones debido al formato u OCR.
        required: false
        threshold: null
        validator:
          type: regex
          pattern: '^\s*(?:CVU\s*[:Nº°#-]?\s*)?(?:\d[\s-]?){22}\s*$'

      alias:
        dtype: str
        description: >
          Alias bancario correspondiente exclusivamente a la cuenta
          donde deben depositarse los fondos embargados.
          No extraer aliases pertenecientes a cuentas del demandado.
        required: false
        threshold: null

      numero_cuenta:
        dtype: str
        description: >
          Número de cuenta judicial o bancaria utilizada para recibir
          las sumas embargadas.
          Conservar separadores, barras, guiones y otros caracteres
          que formen parte del número.
        required: false
        threshold: null

      banco:
        dtype: str
        description: >
          Banco o entidad financiera donde se encuentra abierta
          la cuenta de depósito indicada por el juzgado.
        required: false
        threshold: null

      titular:
        dtype: str
        description: >
          Titular explícitamente indicado de la cuenta donde deben
          depositarse las sumas embargadas.
          No asumir un titular si el documento no lo indica.
        required: false
        threshold: null

  # ============================================================
  # V6 - PERSONA EMBARGADA ESTRICTA
  # ============================================================
  schema_v6_persona_embargada_estricta:
    type: structured

    name: persona_embargada

    description: >
      Extraer exclusivamente a la persona física o jurídica sobre cuyos
      bienes, fondos, cuentas, haberes o activos recae directamente
      la medida judicial de embargo, retención o ejecución.

      La persona extraída debe estar explícitamente vinculada en el texto
      con expresiones como demandado, demandada, embargado, embargada,
      ejecutado, ejecutada, deudor, deudora, o con una frase que indique
      que sus fondos, cuentas, bienes o haberes serán embargados o retenidos.

      No extraer una persona solamente por aparecer mencionada en el documento.

      Excluir siempre jueces, secretarios, abogados, letrados, funcionarios,
      firmantes, autorizados para diligenciar, actores, acreedores,
      representantes, notificadores, destinatarios del oficio y titulares
      de cuentas utilizadas únicamente para depositar fondos judiciales.

      Si no existe evidencia suficiente de que la medida recae sobre una
      persona concreta, no extraerla.

    fields:
      nombre:
        dtype: str
        description: >
          Nombre completo o razón social exclusivamente del sujeto
          sobre el cual recae la medida.
          No devolver nombres de jueces, abogados, funcionarios,
          firmantes, autorizados, actores, acreedores ni destinatarios.
        required: true
        threshold: null

      rol_mencionado:
        dtype: str
        description: >
          Rol jurídico con el cual el documento identifica explícitamente
          a la persona extraída.
        required: false
        threshold: null
        choices:
          - demandado
          - demandada
          - embargado
          - embargada
          - ejecutado
          - ejecutada
          - deudor
          - deudora
          - otro

      evidencia_rol:
        dtype: str
        description: >
          Fragmento breve del texto que demuestra que la medida de embargo,
          retención o ejecución recae sobre la persona indicada en nombre.
        required: false
        threshold: null

      dni:
        dtype: str
        description: >
          DNI perteneciente exclusivamente a la misma persona indicada
          en nombre.
          No extraer DNI de abogados, autorizados, jueces, funcionarios,
          acreedores ni otras personas mencionadas.
        required: false
        threshold: null
        validator:
          type: regex
          pattern: '^\s*(?:D\.?\s*N\.?\s*I\.?\s*[:Nº°#-]?\s*)?\d{1,2}(?:[.\s]?\d{3}){2}\s*$'

      cuil_cuit:
        dtype: str
        description: >
          CUIL o CUIT perteneciente exclusivamente a la misma persona
          indicada en nombre.
          No extraer CUIT del Poder Judicial, bancos, empresas destinatarias,
          abogados, funcionarios ni otras personas ajenas al sujeto embargado.
        required: false
        threshold: null
        validator:
          type: regex
          pattern: '^\s*(?:CUIL|CUIT|CUIL/CUIT)?\s*[:Nº°#-]?\s*\d{2}[-\s]?\d{8}[-\s]?\d\s*$'
